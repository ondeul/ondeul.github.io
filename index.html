<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="인원과 1인 예산 등을 선택하시면 온들 공방에서 가능한 라탄·글라스아트 단체 수업 품목을 찾아드립니다.">
<meta property="og:title" content="온들 단체수업 찾기">
<meta property="og:description" content="인원과 1인 예산 등 선택하시면 가능한 품목 찾아드립니다. | 온들 공방">
<meta property="og:type" content="website">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>온들 단체수업 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gothic+A1:wght@400;500;700&display=swap">
<style>
/* Layout: 흰 바탕 + 로즈브라운 한 계열 톤온톤 + 참고 핀의 카드 구성. 위쪽 히어로 카드(사진·명조 제목)와 동그란 작품 줄 → 둥근 질문 카드 → 결과는 첫 품목을 초록 추천 카드로, 나머지는 사진 위·설명 아래 상품 카드 그리드 */
:root{
  --bg:#FFFFFF; --surface:#FBF6F5; --card:#F5E9E7; --ink:#3A2E2C; --muted:#8F7F7C; --line:#EBDDDA;
  --green:#9E615A; --green-ink:#FFFFFF; --soft:#F3E6E3; --brown:#B7827C; --glass:#8C716C;
  --display:"Nanum Myeongjo","Gowun Batang",serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-lg:22px; --r-md:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1716; --surface:#262020; --card:#302827; --ink:#F2E7E4; --muted:#B8A6A2; --line:#433735;
  --green:#DDA7A1; --green-ink:#2A1715; --soft:#3A302E; --brown:#D9A9A3; --glass:#C4A5A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1716; --surface:#262020; --card:#302827; --ink:#F2E7E4; --muted:#B8A6A2; --line:#433735;
  --green:#DDA7A1; --green-ink:#2A1715; --soft:#3A302E; --brown:#D9A9A3; --glass:#C4A5A0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* 히어로 */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--green)}
.brand{font-family:var(--display);font-weight:700;font-size:15px;color:var(--green)}
.hero-card{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:stretch;box-shadow:0 1px 0 var(--line)}
.hero-text{padding:24px 20px;display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--brown)}
h1{font-family:var(--display);font-size:27px;line-height:1.28;margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0;font-size:13.5px}
.hero-card{position:relative}
.hero-text{padding:28px 26px}
.hero-img{position:absolute;top:0;right:0;bottom:0;width:calc(100% / 2.15);height:100%;object-fit:cover;display:block;background:var(--card)}
.strip-wrap{display:flex;flex-direction:column;gap:8px}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dot{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer}
.dot img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.dot span{font-size:11px;line-height:1.3;text-align:center;color:var(--muted);word-break:keep-all}

/* 진행 · 질문 카드 */
.progress{display:flex;gap:5px}
.progress span{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .2s}
.progress span.on{background:var(--green)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.qnum{font-size:11px;font-weight:700;color:var(--brown);letter-spacing:.12em}
h2{font-family:var(--display);font-size:23px;margin:0;line-height:1.35;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
.hint{font-size:13px;color:var(--muted);margin:-10px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.opt{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:var(--r-md);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:background .15s,border-color .15s,color .15s}
.opt span{font-weight:500}
.opt small{color:var(--muted);font-size:12px}
.opt:hover{border-color:var(--green)}
.opt[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.opt[aria-pressed="true"] small{color:var(--green-ink);opacity:.75}
.opt:focus-visible,.btn:focus-visible,.stepper button:focus-visible,input:focus-visible,.chip:focus-visible,.ph:focus-visible,.dot:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:22px;cursor:pointer}
.stepper input{width:110px;font:inherit;font-size:30px;font-family:var(--display);font-weight:800;text-align:center;border:none;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;padding:4px}
.stepper .unit{font-size:18px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;border:0;background:var(--soft);color:var(--muted);cursor:pointer}
.chip:hover{color:var(--ink);background:var(--soft)}
.disc{font-size:13px;color:var(--green);margin:0;font-weight:500}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn:disabled{opacity:.35;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.kakao{background:#FEE500;border-color:#FEE500;color:#191600}

/* 결과 */
.summary{display:flex;flex-wrap:wrap;gap:6px}
.summary span{font-size:12.5px;background:var(--soft);border-radius:999px;padding:4px 12px}
.sec-title{font-family:var(--display);font-size:19px;font-weight:800;margin:6px 0 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-title em{font-style:normal;font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted)}
.sec-title.band{margin:16px 0 2px;padding:12px 16px;background:var(--card);border-top:3px solid var(--brown);border-bottom:1px solid var(--line);border-radius:4px}
.sec-title.band em{color:var(--green)}
.sec-title.band.up{border-top-color:var(--line);background:var(--surface)}
.sec-title.band.up em{color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.item{background:var(--surface);border-radius:var(--r-md);padding:8px 8px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.ph{width:100%;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--card);border:0;padding:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);cursor:zoom-in}
div.ph{cursor:default}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.ph:hover img{transform:scale(1.04)}
.ph.glass{background:var(--card)}
.item .body{min-width:0;display:flex;flex-direction:column;gap:5px;padding:0 4px}
.item .top{display:flex;flex-direction:column;gap:1px}
.craft{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--brown)}
.craft.glass{color:var(--glass)}
.item h3{margin:0;font-family:var(--display);font-size:15.5px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.item p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;border-radius:999px;padding:2px 9px;color:var(--muted);background:var(--soft)}
/* 첫 추천 카드: 짙은 초록 */
.item.feat{grid-column:1/-1;background:var(--green);color:var(--green-ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:12px;align-items:center}
.item.feat .body{gap:8px;padding:4px 6px 4px 0}
.item.feat h3{font-size:22px}
.item.feat .craft,.item.feat p{color:var(--green-ink);opacity:.8}
.item.feat p{font-size:13.5px;-webkit-line-clamp:4}
.item.feat .tag{background:color-mix(in srgb,var(--green-ink) 14%,transparent);color:var(--green-ink)}
.item.feat .top::before{content:"추천 수업";align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--green-ink);color:var(--green);margin-bottom:6px}
@media (max-width:420px){.item.feat{grid-template-columns:minmax(0,1fr)}.item.feat .body{padding:0 4px 4px}.item p{font-size:12px}.tags .tag:nth-child(2){display:none}.item.feat .tags .tag:nth-child(2){display:inline}}
.notice{margin:0;padding:0 4px;font-size:13px;line-height:1.7;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border-radius:var(--r-md);padding:18px}
.ask{background:var(--surface);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--green)}
.ask textarea{width:100%;font:inherit;font-size:13.5px;background:var(--soft);color:var(--ink);border:0;border-radius:12px;padding:12px;resize:vertical}
.ask .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ask .row .btn{flex:1 1 200px}
.ask .contact{font-size:13px;color:var(--muted)}
.ask .contact b{color:var(--ink);user-select:all}
.ask .contact a{color:var(--ink)}
.toast{font-size:13px;color:var(--green);font-weight:500}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.light{position:fixed;inset:0;z-index:20;background:rgba(14,18,14,.86);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.light[hidden]{display:none}
.light img{width:min(100%,420px);aspect-ratio:1/1;object-fit:cover;border-radius:16px}
@media (max-width:520px){.hero-card{grid-template-columns:minmax(0,1fr)}.hero-img{position:static;width:100%;height:auto;aspect-ratio:16/10;order:-1}.hero-text{padding:22px 20px}h1{font-size:25px}}
/* 고딕(본문) 자간 -60 */
body,button,input,textarea{letter-spacing:-0.06em}
.eyebrow,.qnum,.craft,.summary span,.tag,.sec-title em,.item.feat .top::before,.opt span,.opt small,.notice,.disc{letter-spacing:-0.06em}
.sec-title{letter-spacing:-.01em}
.brand,.stepper input{letter-spacing:0}
:root{--emph:#95645C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--emph:#E2A9A3}}
:root[data-theme="dark"]{--emph:#E2A9A3}
.notice .emph{color:var(--emph);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="hero">
    <div class="hero-top"><span class="logo">ondeul</span><span class="brand">- 일상에 온기가 들다.</span></div>
    <div class="hero-card">
      <div class="hero-text">
        <p class="eyebrow">단체 · 출강 클래스</p>
        <h1>우리 단체에 맞는<br>공예 수업 찾기</h1>
        <p class="lead">인원과 1인 예산 등 선택하시면<br>가능한 품목 찾아드립니다.</p>
      </div>
      <img class="hero-img" id="heroImg" alt="온들 공방 라탄 스탠드 완성작">
    </div>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="stage"></main>
  <p class="foot">| 온들 공방 | 서울시 금천구 금하로1길 75 1층</p>
</div>
<div class="light" id="light" hidden><img id="lightImg" alt=""></div>

const rateFor = (n,craft="glass") => (RULES[craft].discount.find(d=>n>=d.min)||{rate:0}).rate;

const priceFor = (p,n,craft="glass") => Math.max(RULES[craft].floor, Math.round(p*(1-rateFor(n,craft))/100)*100);
const hrs = h => h<1?`${h*60}분`:(h%1?`${Math.floor(h)}시간 ${Math.round(h%1*60)}분`:`${h}시간`);

function renderProgress(){

function label(key,v){const q=Q.find(x=>x.key===key);const o=q.opts.find(o=>same(o.v,v));return o?o.t:"";}

function render(){
  renderProgress();

  const q=Q[state.step], val=state.a[q.key];

  stage.innerHTML=html;
  document.getElementById("back").onclick=()=>{state.step--;render()};
  document.getElementById("next").onclick=()=>{state.step++;render()};
  if(q.type==="number"){
    const inp=document.getElementById("people"), disc=document.getElementById("disc");
    const show=()=>{disc.textContent="";};
    const set=n=>{n=Math.max(1,Math.min(300,n||1));state.a.people=n;inp.value=n;show();};

/* 품목의 구성(기본·표준·고급)마다 한 장씩: 예산 범위 안 / 예산보다 낮은 / 조금 넘는 */
function match(){
  const a=state.a, n=a.people, [min,max]=a.budget;
  const fit=[], low=[], up=[];
  ITEMS.forEach(it=>{
    if(a.craft!=="any" && it.craft!==a.craft) return;
    if(it.hours>a.time) return;
    it.tiers.forEach(t=>{
      const r={it,t,price:priceFor(t.p,n,it.craft)+(n>=ASSIST[it.craft]?ASSIST_FEE*RULES[it.craft].assistShare/n:0),multi:it.tiers.length>1};
      if(r.price>max+TOLERANCE){ if(r.price<=max+UPSELL_GAP) up.push(r); }
      else if(r.price>=min) fit.push(r);
      else low.push(r);
    });
  });
  const desc=(x,y)=>y.price-x.price;
  fit.sort(desc); low.sort(desc); up.sort((x,y)=>x.price-y.price);
  return {fit,low,up};
}

function itemHTML(r,isUp){
  const {it,t,price,multi}=r, n=state.a.people, max=state.a.budget[1];
  const name=multi?`${it.name} · ${t.k}`:it.name;
  const img=it.photo&&PHOTOS[it.photo];
  const ph=img?`<button type="button" class="ph" data-img="${it.photo}" aria-label="${name} 사진 크게 보기"><img src="${img}" alt="${it.name} 완성 사진" loading="lazy"></button>`
              :`<div class="ph ${it.craft}" aria-hidden="true">${CRAFT[it.craft]}</div>`;
  return `<article class="item">${ph}<div class="body">
    <div class="top"><div class="craft ${it.craft}">${CRAFT[it.craft]}</div><h3>${name}</h3></div>
    ${t.note?`<span class="tier-note">${t.k} 구성: ${t.note}</span>`:""}
    <p>${it.desc}</p>
    <div class="tags"><span class="tag">약 ${hrs(it.hours)}</span><span class="tag">${it.size}</span></div>
  </div></article>`;
}

  stage.querySelectorAll(".ph[data-img]").forEach(b=>b.onclick=()=>{const l=document.getElementById("light");document.getElementById("lightImg").src=PHOTOS[b.dataset.img];document.getElementById("lightImg").alt=b.getAttribute("aria-label");l.hidden=false;});
  /* 링크 버튼은 문구를 복사한 뒤 그대로 채팅창을 열고, '문구만 복사'는 복사만 함 */
  document.getElementById("copyMail").onclick=()=>{const t=document.getElementById("toast");try{navigator.clipboard.writeText("on_deul_@naver.com").then(()=>t.textContent="메일 주소를 복사했습니다.",()=>t.textContent="메일 주소를 길게 눌러 복사해 주세요.")}catch(e){t.textContent="메일 주소를 길게 눌러 복사해 주세요."}};
  stage.querySelectorAll("[data-copy]").forEach(el=>el.addEventListener("click",()=>{
    const ta=document.getElementById("msg"), t=document.getElementById("toast"), isLink=el.tagName==="A";
    const ok=()=>t.textContent=isLink?"문구를 복사했습니다. 열린 채팅창에 붙여넣어 주세요.":"복사했습니다.";
    const fb=()=>{ta.focus();ta.select();t.textContent="문구를 선택해 두었습니다. 길게 눌러 복사한 뒤 채팅창에 붙여넣어 주세요.";};
    try{navigator.clipboard.writeText(ta.value).then(ok,fb)}catch(e){fb()}
  }));
}
document.getElementById("light").onclick=e=>{e.currentTarget.hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("light").hidden=true});

document.getElementById("heroImg").src=HERO;
render();
</script>
